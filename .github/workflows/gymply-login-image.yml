# Gymply's patched Login V2 image, built from this fork until the patches are released upstream.
#
# A tag `v<upstream version>-gymply.<n>` on a `gymply/v<upstream version>` branch (the upstream release
# tag plus Gymply's patches) publishes ghcr.io/<owner>/zitadel-login:<tag>. Build steps follow
# upstream's pack.yml (Login standalone build, then apps/login/Dockerfile), for linux/amd64 only:
# Gymply's hosts are amd64.
#
# Every action is pinned to a commit (its release in the comment): this job may publish packages, and a
# moved version tag in an action's repository must not change what it runs. Gymply pins the image by digest.
name: Gymply login image

on:
  push:
    tags:
      - "v*-gymply.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Login
        run: pnpm nx run --nxBail @zitadel/login:test-unit
      - name: Build Login standalone
        run: pnpm nx run --nxBail @zitadel/login:build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Tags and Labels for the Login Container Image
        id: login-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/zitadel-login
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=ZITADEL Login V2 with Gymply's patches pending upstream
          tags: |
            type=ref,event=tag
            type=sha,prefix=,suffix=,format=long
      - name: Build and Push the Login Container Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/login
          platforms: linux/amd64
          push: true
          labels: ${{ steps.login-meta.outputs.labels }}
          tags: ${{ steps.login-meta.outputs.tags }}
